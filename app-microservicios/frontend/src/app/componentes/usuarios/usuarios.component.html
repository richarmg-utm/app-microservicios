<div class="usuarios-container container">
  <h2>👥 Gestión de Usuarios</h2>

  <!-- Formulario para registrar -->
  <div class="form-group">
    <h3>📝 Registrar nuevo usuario</h3>
    <div class="input-group">
      <input [(ngModel)]="nuevoUsuario.nombre" placeholder="Nombre completo" />
      <input [(ngModel)]="nuevoUsuario.email" placeholder="Correo electrónico" />
      <button (click)="registrar()">Registrar</button>
    </div>
  </div>

  <!-- Lista de usuarios -->
  <h3>📋 Lista de usuarios</h3>
  <ul class="lista">
    <li *ngFor="let u of usuarios" class="usuario-item">
      <span>
        <strong>{{ u.nombre }}</strong>
        <span class="usuario-email">{{ u.email }}</span>
      </span>
      <span class="usuario-id">ID: {{ u.id }}</span>
    </li>
  </ul>
</div>
